<div id="kiosk-wrapper" style="background-color: #d6e4ea; width:100vw; height:100vh; margin:0; padding:0; overflow:hidden; position:fixed; top:0; left:0;">
  <iframe id="kiosk-iframe" src="https://docs.google.com/forms/d/e/1FAIpQLSdlIfwFy2tI663tCN2bHWkM9WRHP2rY5owa4BrWFouZPtQLcg/viewform" style="position:fixed; top:0; left:0; width:100vw; height:100vh; border:none; margin:0; padding:0; display:block; z-index:999;"></iframe>
</div>

<script>
  // Crucial: This intercepts the container frame directly
  var formUrl = "https://docs.google.com/forms/d/e/1FAIpQLSdlIfwFy2tI663tCN2bHWkM9WRHP2rY5owa4BrWFouZPtQLcg/viewform";
  
  // This function forces a violent DOM rebuild of the iframe from scratch, 
  // bypassing browser navigation restrictions so the form never turns white or goes missing.
  function forceKioskReset() {
    var wrapper = document.getElementById('kiosk-wrapper');
    wrapper.innerHTML = ''; // Wipes the old iframe completely out of memory
    
    // Injects a brand new instance instantly
    var newIframe = document.createElement('iframe');
    newIframe.src = formUrl + "?t=" + new Date().getTime(); // Appends cache-buster timestamp
    newIframe.style.cssText = "position:fixed; top:0; left:0; width:100vw; height:100vh; border:none; margin:0; padding:0; display:block; z-index:999;";
    wrapper.appendChild(newIframe);
  }

  // Fallback programmatic loop (Matches NeatKiosk logic safely)
  window.addEventListener('message', function(e) {
     if(e.data === 'clear') { forceKioskReset(); }
  });
</script>
