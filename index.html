<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    /* 1. Forces the parent window to match your exact slate-blue color */
    html, body {
      background-color: #d6e4ea !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      width: 100vw !important;
      height: 100vh !important;
    }

    /* 2. Forces NeatKiosk's rendering engine to use local iPad font files */
    * {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif !important;
      -webkit-font-smoothing: antialiased !important;
    }

    .kiosk-container {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      background-color: #d6e4ea !important;
      border: none !important;
    }

    iframe {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
    }
  </style>
</head>
<body>

  <div class="kiosk-container">
    <!-- Clean, standard URL layout so JavaScript remains enabled -->
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdlIfwFy2tI663tCN2bHWkM9WRHP2rY5owa4BrWFouZPtQLcg/viewform"></iframe>
  </div>

</body>
</html>
